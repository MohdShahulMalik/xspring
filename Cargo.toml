[package]
name = "xspring"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
authors = ["Shahul Malik <mohdshahulmalik@gmail.com"]
license = "MIT OR Apache-2.0"
description = "Scaffold Spring Boot projects and add dependencies to existing ones from the terminal"
readme = "README.md"
homepage = "https://github.com/MohdShahulMalik/xspring"
repository = "https://github.com/MohdShahulMalik/xspring"
keywords = ["cli", "spring", "spring-boot", "generator", "dependencies"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[package.metadata.wix]
upgrade-guid = "D6A021FD-D2A8-463C-9A1D-2A880FBC5ABE"
path-guid = "D89B20E6-3BE9-44CA-92BA-49365A1081B7"
license = false
eula = false

[dependencies]
anyhow = "1.0.99"
clap = "4.5.47"
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = ["tracing"] }
inquire = "0.9.4"
quick-xml = { version = "0.42.0", default-features = false }
regex-lite = "0.1.9"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.21"
tokio = { version = "1.47.1", features = ["macros", "rt"] }
tracing = { version = "0.1.41", features = ["log"] }
tracing-appender = "0.2.3"
tracing-subscriber = "0.3.18"
zip = "9.0.5"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
serde_json = "1"
